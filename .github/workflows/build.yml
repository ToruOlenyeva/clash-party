name: Build & Sync Upstream

on:
  schedule:
    # 每天北京时间 04:00 自动检查上游更新
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '即使上游未升版本号，也自动递增第4位小版本号并打包发布新 Release'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions: write-all

jobs:
  sync-and-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      release_version: ${{ steps.decide.outputs.release_version }}
      upstream_sha: ${{ steps.sync.outputs.upstream_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: smart_core
          fetch-depth: 0

      - name: Check upstream mihomo-party-org/clash-party
        id: sync
        run: |
          set +e
          git remote add upstream https://github.com/mihomo-party-org/clash-party.git 2>/dev/null || true
          git fetch upstream smart_core --tags
          UPSTREAM_HEAD=$(git rev-parse upstream/smart_core)
          LOCAL_BASE=$(git merge-base HEAD upstream/smart_core)
          echo "upstream_sha=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"
          echo "上游 smart_core 最新提交: $UPSTREAM_HEAD (当前公共基线: $LOCAL_BASE)"

      - name: Decide build & target version
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 在临时分支试合并上游最新代码以读取最新 package.json 版本号
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff -X ours upstream/smart_core >/dev/null 2>&1 || git merge --abort 2>/dev/null || true

          BASE_VER=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version.replace(/-.*$/, '')")
          git merge --abort 2>/dev/null || git reset --hard HEAD >/dev/null 2>&1 || true
          echo "基础版本号: $BASE_VER"

          RELEASE_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          LATEST_BODY=$(echo "$RELEASE_JSON" | jq -r '.body // empty')
          echo "当前仓库最新已发布 Tag: ${LATEST_TAG:-无}"

          SHOULD_BUILD="false"
          TARGET_VER="$BASE_VER"

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF_NAME" == v* ]]; then
            SHOULD_BUILD="true"
            TARGET_VER="${REF_NAME#v}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_BUILD="true"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            if [ -z "$LATEST_TAG" ]; then
              SHOULD_BUILD="true"
            elif ! echo "$LATEST_BODY" | grep -q "upstream-sha: $UPSTREAM_SHA"; then
              echo "检测到上游存在尚未打包发布的新提交 ($UPSTREAM_SHA)，触发自动编译！"
              SHOULD_BUILD="true"
            fi
          fi

          if [ "$SHOULD_BUILD" = "true" ] && [ "$EVENT_NAME" != "push" ]; then
            EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$BASE_VER" | jq -r '.id // empty')
            if [ -z "$EXISTING" ]; then
              TARGET_VER="$BASE_VER"
            else
              PATCH_NUM=1
              while true; do
                CANDIDATE="${BASE_VER}.${PATCH_NUM}"
                CHECK_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$CANDIDATE" | jq -r '.id // empty')
                if [ -z "$CHECK_ID" ]; then
                  TARGET_VER="$CANDIDATE"
                  break
                fi
                PATCH_NUM=$((PATCH_NUM + 1))
              done
            fi
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "release_version=$TARGET_VER" >> "$GITHUB_OUTPUT"
          echo "决定结果: should_build=$SHOULD_BUILD, release_version=$TARGET_VER"

  windows-release:
    needs: [sync-and-check]
    if: needs.sync-and-check.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout smart_core & Merge Upstream in Memory
        uses: actions/checkout@v6
        with:
          ref: smart_core
          fetch-depth: 0

      - name: Merge latest upstream smart_core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mihomo-party-org/clash-party.git 2>$null
          git fetch upstream smart_core
          git merge --no-edit -X ours upstream/smart_core
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Upstream merge encountered conflict, aborting merge and keeping custom smart_core"
            git merge --abort 2>$null
          }
          $global:LASTEXITCODE = 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set Release Version in package.json
        env:
          TARGET_VERSION: ${{ needs.sync-and-check.outputs.release_version }}
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json','utf8')); pkg.version=process.env.TARGET_VERSION; fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"

      - name: Install Dependencies
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: pnpm install

      - name: Prepare Sidecars & Assets
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: pnpm prepare --x64

      - name: Build Windows x64 Installer & Portable
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
        run: pnpm build:win --x64

      - name: Add Portable Flag
        run: |
          New-Item -Path "PORTABLE" -ItemType File -Force
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
          }

      - name: Generate Checksums & Legacy Copies
        run: |
          pnpm checksum setup.exe portable.7z
          pnpm copy-legacy

      - name: Generate latest.yml & changelog.md
        env:
          NODE_ENV: production
          GITHUB_EVENT_NAME: release
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_SHA: ${{ needs.sync-and-check.outputs.upstream_sha }}
        run: node scripts/updater.mjs

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sync-and-check.outputs.release_version }}
          name: v${{ needs.sync-and-check.outputs.release_version }}
          body_path: release-notes.md
          prerelease: false
          draft: false
          make_latest: true
          files: |
            latest.yml
            dist/*.sha256
            dist/*setup.exe
            dist/*portable.7z
          token: ${{ secrets.GITHUB_TOKEN }}
